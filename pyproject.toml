[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eag-guard"
version = "0.1.0"
description = "EAG-Guard: authorization-invariant defense against indirect prompt injection for tool-using agents"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
bench = ["agentdojo==0.1.35"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
