<text x="138.0" y="339.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.2" fill="#243447" font-weight="normal">字段 ← 来源</text>
<text x="138.0" y="358.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.2" fill="#243447" font-weight="normal">字段型 / 内容型</text>
