<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" version="1.1">
<rect x="0" y="0" width="1280" height="740" fill="#FFFFFF"/>
<g id="title">
<text x="48.0" y="56.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="26" fill="#16283F" font-weight="bold">证据—授权—动作图：六类节点与五类边怎么连</text>
<text x="48.0" y="86.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.8" fill="#4A5A6A" font-weight="normal">授权只从用户请求推导；证据来自工具返回；参数是动作的实参——五类边把它们连成一张可回溯的图。</text>
<line x1="48.0" y1="102.0" x2="1232.0" y2="102.0" stroke="#D8E0E8" stroke-width="1.2" stroke-linecap="round"/>
</g>
<g id="nodes">
