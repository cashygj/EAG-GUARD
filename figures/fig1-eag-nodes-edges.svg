<text x="632.0" y="412.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12" fill="#C0392B" font-weight="bold">支撑</text>
<path d="M1015.0,392.0 L1015.0,522.0 L748.2,522.0" fill="none" stroke="#5B6B7C" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7,5"/>
<polygon points="740.0,522.0 750.0,517.6 750.0,526.4" fill="#5B6B7C"/>
