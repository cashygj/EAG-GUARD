</g>
<g id="notes">
<text x="632.0" y="432.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.5" fill="#C0392B" font-weight="normal">只由不可信证据支撑</text>
<text x="632.0" y="448.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.5" fill="#C0392B" font-weight="normal">→ 该值为「注入」</text>
<text x="1027.0" y="484.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.5" fill="#71808F" font-weight="normal">结果切片成新证据</text>
<text x="772.0" y="192.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.2" fill="#71808F" font-weight="normal">授权范围的成员（工具 / 对象）</text>
</g>
<g id="legend">
<line x1="48.0" y1="608.0" x2="74.0" y2="608.0" stroke="#2F5597" stroke-width="2.8" stroke-linecap="round"/>
<polygon points="81,608 72,604 72,612" fill="#2F5597"/>
<text x="88.0" y="612.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11" fill="#4A5A6A" font-weight="normal">授予 / 声明委托：结构边，溯源的终止根</text>
<line x1="327.5" y1="608.0" x2="353.5" y2="608.0" stroke="#2E7D32" stroke-width="2.8" stroke-linecap="round"/>
<polygon points="360.48,608 351.48,604 351.48,612" fill="#2E7D32"/>
<text x="367.5" y="612.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11" fill="#4A5A6A" font-weight="normal">派生：由委托派生 → 用户委托</text>
<line x1="552.0" y1="608.0" x2="578.0" y2="608.0" stroke="#0F766E" stroke-width="2.8" stroke-linecap="round"/>
<polygon points="584.96,608 575.96,604 575.96,612" fill="#0F766E"/>
<text x="592.0" y="612.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11" fill="#4A5A6A" font-weight="normal">支撑：授权或动作支撑参数</text>
<line x1="48.0" y1="632.0" x2="74.0" y2="632.0" stroke="#C0392B" stroke-width="2.8" stroke-linecap="round"/>
<polygon points="81,632 72,628 72,636" fill="#C0392B"/>
<text x="88.0" y="636.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11" fill="#4A5A6A" font-weight="normal">支撑：证据支撑，来源不可信 → 注入</text>
<line x1="305.5" y1="632.0" x2="331.5" y2="632.0" stroke="#5B6B7C" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6,4"/>
<polygon points="338.48,632 329.48,628 329.48,636" fill="#5B6B7C"/>
<text x="345.5" y="636.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11" fill="#4A5A6A" font-weight="normal">产出：动作产出新证据（不参与回溯）</text>
</g>
<g id="callout">
<rect x="48.0" y="658.0" width="1184.0" height="58.0" rx="10" fill="#F8FAFC" stroke="#DCE3EA" stroke-width="1.1"/>
<text x="66.0" y="682.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12" fill="#243447" font-weight="normal">字段级溯源的走法：从参数节点出发，只沿「支撑 / 派生」两类边反向回溯；到达用户请求、授权或委托（可信根）即放行，只到达不可信证据（不可信根）即拒绝。</text>
<text x="66.0" y="703.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.5" fill="#71808F" font-weight="normal">工具与对象是授权范围的成员，判定前先做成员检查，不参与这次回溯。</text>
</g>
</svg>
