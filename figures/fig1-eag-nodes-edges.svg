<text x="418.0" y="333.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12" fill="#2E7D32" font-weight="bold">派生</text>
<text x="395.0" y="359.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10" fill="#71808F" font-weight="normal">运行时派生取值</text>
