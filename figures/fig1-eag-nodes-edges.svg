<text x="78.0" y="130.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="13.5" fill="#2F5597" font-weight="bold">用户请求</text>
<text x="78.0" y="151.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.8" fill="#243447" font-weight="normal">唯一可信输入</text>
<text x="78.0" y="170.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="11.8" fill="#243447" font-weight="normal">解析器不读工具返回</text>
<rect x="204.5" y="112.0" width="45.5" height="18.0" rx="9" fill="#2F5597" stroke="none" stroke-width="0"/>
<text x="211.5" y="125.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.5" fill="#FFFFFF" font-weight="bold">可信根</text>
