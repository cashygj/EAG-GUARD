<text x="311.5" y="313.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10.5" fill="#FFFFFF" font-weight="bold">可信根</text>
<rect x="900.0" y="292.0" width="230.0" height="100.0" rx="12" fill="#EAF3EA" stroke="#2E7D32" stroke-width="1.8"/>
<rect x="900" y="292" width="6" height="100" rx="3" fill="#2E7D32"/>
<text x="918.0" y="318.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="14" fill="#2E7D32" font-weight="bold">动作</text>
<text x="918.0" y="339.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.2" fill="#243447" font-weight="normal">工具（实参）签名</text>
<text x="918.0" y="358.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.2" fill="#243447" font-weight="normal">规划器提议的动作</text>
<rect x="500.0" y="472.0" width="240.0" height="100.0" rx="12" fill="#F1F4F7" stroke="#5B6B7C" stroke-width="1.8"/>
