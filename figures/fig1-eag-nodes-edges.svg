<text x="172.0" y="266.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="10" fill="#71808F" font-weight="normal">用户指定某字段由该来源取值</text>
<path d="M360.0,342.0 L491.8,342.0" fill="none" stroke="#2E7D32" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
