<text x="518.0" y="498.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="14" fill="#5B6B7C" font-weight="bold">证据</text>
<text x="518.0" y="519.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.2" fill="#243447" font-weight="normal">工具返回切片</text>
<text x="518.0" y="538.0" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="12.2" fill="#243447" font-weight="normal">来源 + 可信标记 + 字段</text>
</g>
<g id="edges">
